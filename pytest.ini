[pytest]
# Pytest configuration for Selenium-Python automation tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Add src directory to Python path for imports
pythonpath = .

# Show extra test info
addopts = 
    -v
    --strict-markers
    --tb=short

# Markers for test organization
markers =
    heroku: Tests for Heroku internet application
    web_table: Tests for web table functionality
    smoke: Smoke tests
    regression: Regression tests
